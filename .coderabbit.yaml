language: en
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DRAFT"
chat:
  auto_reply: true
