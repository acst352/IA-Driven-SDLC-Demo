# SonarQube project configuration
# https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=ia-driven-sdlc-demo
sonar.projectName=Mercado Libre Clone
sonar.projectVersion=0.1.0
sonar.organization=oekwpd

# Sources
sonar.sources=src
sonar.tests=e2e
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/.vercel/**,**/playwright-report/**,**/test-results/**,**/build/**,**/coverage/**,**/*.d.ts,**/next-env.d.ts,**/route.ts
sonar.test.exclusions=**/node_modules/**

# Language
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage (cuando se integre)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test reports (Playwright con junit reporter)
# sonar.testExecutionReportPaths=playwright-report/results.xml
sonar.test.inclusions=e2e/**/*.spec.ts
